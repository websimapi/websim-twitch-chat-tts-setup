<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Chat TTS</title>
  <link rel="stylesheet" href="style.css">
  <!-- Load TMI.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/index.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="setup-section">
      <h1>Twitch Chat TTS</h1>
      <div class="input-group">
        <label for="channel">Twitch Channel:</label>
        <input type="text" id="channel" placeholder="Enter channel name">
        <button onclick="connectToChannel()">Connect</button>
      </div>
    </div>
    
    <div class="chat-section">
      <h2>Chat Messages</h2>
      <div id="chat-messages"></div>
      
      <div class="controls">
        <label for="volume">Volume:</label>
        <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">
        
        <label for="rate">Speech Rate:</label>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
        
        <label for="pitch">Pitch:</label>
        <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
      </div>
    </div>
  </div>
  <script src="script.js"></script>

</body>
</html>
